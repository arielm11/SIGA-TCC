services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: siga-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Falha ao subir se a variável não estiver definida — ver .env.example.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - siga-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  siga-sqlserver-data:
