name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  # RNF-02 (migração Radzen) nunca teve um número — medido em 2026-08-29 (issue #78):
  # publish Release sem o workload wasm-tools (CI/dev não o têm instalado, então este é o
  # bundle real hoje) deu ~4.94 MB (4937970 bytes) em Brotli, o formato que todo navegador
  # moderno baixa. 6 MB dá ~20% de folga sobre a medição — ajuste este número se o orçamento
  # precisar mudar, é só um valor de configuração.
  WASM_BUDGET_BYTES: 6000000

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore --locked-mode
        # --locked-mode: falha se os packages.lock.json estiverem dessincronizados
        # dos .csproj. Ao alterar/adicionar um PackageReference, regenere os locks
        # localmente com "dotnet restore --force-evaluate" e commite o resultado.
        # TccManager.Client não gera lock (ver comentário no .csproj dele).

      - name: Verificar formatação (dotnet format)
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true
        # continue-on-error: true por enquanto — troque para "false" quando
        # o time estiver confortável com o gate de formatação bloqueando PRs.

      - name: Scan de vulnerabilidades em pacotes
        run: |
          set -o pipefail
          dotnet list TccManager.sln package --vulnerable --include-transitive --no-restore \
            | tee vulnerable-packages.txt
          {
            echo "## Scan de vulnerabilidades de pacotes"
            echo ""
            echo '```'
            cat vulnerable-packages.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "https://github.com/advisories" vulnerable-packages.txt; then
            echo "::warning::Pacote(s) com vulnerabilidade conhecida — veja a aba Summary deste run."
            exit 1
          fi
        continue-on-error: true
        # continue-on-error: true por enquanto — o step existe para VISIBILIDADE
        # (o resultado aparece no log e na aba Summary do run) enquanto os achados
        # já conhecidos não são resolvidos: AngleSharp transitivo via HtmlSanitizer,
        # severidade Moderate, rastreado na issue #95. Troque para "false" quando
        # esses achados estiverem resolvidos, para o scan passar a bloquear PRs.
        # Obs.: "dotnet list package --vulnerable" retorna exit code 0 mesmo com
        # achados — por isso o grep acima é o que marca o step como falho.

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults

      - name: Orçamento do bundle WASM (issue #78)
        run: |
          set -o pipefail
          dotnet publish TccManager.Client/TccManager.Client.csproj \
            --no-restore --configuration Release --output ./publish-client

          # Soma só os .br: é o formato Brotli que todo navegador moderno baixa (o servidor
          # negocia Content-Encoding e serve o pré-comprimido, nunca o .wasm/.dll cru).
          total_bytes=$(find ./publish-client/wwwroot/_framework -name "*.br" -printf "%s\n" | awk '{s+=$1} END {print s+0}')
          total_mb=$(awk "BEGIN { printf \"%.2f\", $total_bytes / 1000000 }")
          budget_mb=$(awk "BEGIN { printf \"%.2f\", $WASM_BUDGET_BYTES / 1000000 }")

          {
            echo "## Orçamento do bundle WASM"
            echo ""
            echo "_framework em Brotli (download real de um navegador moderno): **${total_mb} MB** — orçamento: ${budget_mb} MB"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Bundle WASM (_framework, .br): ${total_mb} MB / orçamento ${budget_mb} MB"

          if [ "$total_bytes" -gt "$WASM_BUDGET_BYTES" ]; then
            echo "::error::Bundle WASM (${total_mb} MB) ultrapassou o orçamento de ${budget_mb} MB — veja issue #78."
            exit 1
          fi
